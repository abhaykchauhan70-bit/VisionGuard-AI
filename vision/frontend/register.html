<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionGuard AI - Register</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark" style="width:46px;height:46px;font-size:19px;">VG</div>
        <div class="auth-title">Create your account</div>
        <div class="auth-subtitle">Start analyzing video with VisionGuard AI</div>
      </div>

      <div id="alert-box" class="alert"></div>

      <form id="register-form">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" minlength="3" required>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create Account</button>
      </form>

      <div class="auth-switch">Already have an account? <a href="index.html">Sign in</a></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alert-box");
      const btn = document.getElementById("register-btn");
      btn.disabled = true; btn.textContent = "Creating...";
      try {
        await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        showAlert(alertBox, "Account created! Redirecting to login...", "success");
        setTimeout(() => window.location.href = "index.html", 1200);
      } catch (err) {
        showAlert(alertBox, err.message);
        btn.disabled = false; btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
